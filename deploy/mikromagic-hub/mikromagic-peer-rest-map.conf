# Include from nginx http{} (for example, /etc/nginx/conf.d/).
# Both included files are generated by sync-peer-rest-map.mjs.

# URI lookup protects peer-scoped REST and the WebFig launch route.
map $uri $mm_peer_tunnel_ip {
    default "";
    include /etc/nginx/mikromagic-peer-rest.map;
}

# Root WebFig paths have no peer id, so resolve the peer selected by the
# short-lived, HttpOnly launch cookie.
map $cookie_mm_webfig_peer $mm_webfig_tunnel_ip {
    default "";
    include /etc/nginx/mikromagic-peer-id.map;
}
