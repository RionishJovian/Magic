# Prefix strip via proxy_pass URI — no $1 / rewrite (those corrupt paths like by-router).

location /internal/provisioner/v1/peers/ {
    limit_req zone=mikromagic_provisioner burst=20 nodelay;
    limit_except GET PUT POST DELETE { deny all; }

    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    if ($http_x_mm_key_id = "") { return 401; }
    if ($http_x_mm_timestamp = "") { return 401; }
    if ($http_x_mm_request_id = "") { return 401; }
    if ($http_x_mm_scope = "") { return 401; }
    if ($http_x_mm_tenant_id = "") { return 401; }
    if ($http_x_mm_router_id = "") { return 401; }
    if ($http_x_mm_requested_by = "") { return 401; }
    if ($http_x_mm_signature = "") { return 401; }

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header X-MM-Key-Id $http_x_mm_key_id;
    proxy_set_header X-MM-Timestamp $http_x_mm_timestamp;
    proxy_set_header X-MM-Request-Id $http_x_mm_request_id;
    proxy_set_header X-MM-Scope $http_x_mm_scope;
    proxy_set_header X-MM-Tenant-Id $http_x_mm_tenant_id;
    proxy_set_header X-MM-Router-Id $http_x_mm_router_id;
    proxy_set_header X-MM-Requested-By $http_x_mm_requested_by;
    proxy_set_header X-MM-Signature $http_x_mm_signature;
    proxy_set_header Authorization "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Connection "";
    proxy_hide_header Server;

    # Strips /internal/provisioner/v1/peers/ and replaces with /v1/peers/
    proxy_pass http://127.0.0.1:8787/v1/peers/;
}

location /internal/provisioner/ {
    return 404;
}
